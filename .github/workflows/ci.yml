name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build:
    name: restore -> build -> test -> 500-line-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ChangeOrder.slnx

      - name: Build (0 warnings)
        # TreatWarningsAsErrors=true is set repo-wide in Directory.Build.props,
        # so any warning fails the build. --no-restore prevents implicit restore.
        run: dotnet build ChangeOrder.slnx --configuration Release --no-restore

      - name: Test
        # Skip Testcontainers-tagged tests in CI (they need Docker-in-Docker);
        # they run on a nightly job or on the dev host.
        run: >-
          dotnet test ChangeOrder.slnx
          --configuration Release
          --no-build
          --filter "Category!=Testcontainers"
          --logger "trx;LogFileName=test-results.trx"

      - name: 500-line check
        # Constitution P-VI quality bar: no .cs file > 500 lines (excluding
        # blank lines and XML-doc `///` lines, per /Users/jlara/.claude/CLAUDE.md).
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' file; do
            count=$(grep -Ev '^\s*$|^\s*///' "$file" | wc -l | tr -d ' ')
            if [ "$count" -gt 500 ]; then
              echo "::error file=$file::$file has $count significant lines (max 500)"
              fail=1
            fi
          done < <(find src tests -name '*.cs' -not -path '*/obj/*' -not -path '*/bin/*' -print0)
          exit $fail
