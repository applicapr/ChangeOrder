name: NuGet Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

jobs:
  nuget-security:
    name: Auditar paquetes NuGet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar paquetes
        run: dotnet restore ChangeOrder.slnx

      - name: Auditar paquetes vulnerables
        run: |
          OUTPUT=$(dotnet list ChangeOrder.slnx package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "has the following vulnerable packages"; then
            echo ""
            echo "::error::Se encontraron paquetes con vulnerabilidades conocidas."
            exit 1
          fi

          echo ""
          echo "No se encontraron paquetes vulnerables."

      - name: Listar paquetes deprecados
        run: |
          dotnet list ChangeOrder.slnx package --deprecated
